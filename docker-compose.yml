services:
  openwrt-fleet-manager:
    build: .
    image: openwrtfleet:latest
    container_name: openwrtfleet
    restart: unless-stopped
    ports:
      - "8789:8789"
    environment:
      # Erster Start: Standard-Admin wird nur einmal angelegt.
      # Ohne OWF_ADMIN_PASSWORD wird ein zufälliges Passwort generiert
      # und per `docker logs openwrtfleet` ausgegeben.
      OWF_ADMIN_USER: admin
      OWF_ADMIN_PASSWORD: ${OWF_ADMIN_PASSWORD:-}
      OPENWRT_FLEET_DB: /data/openwrtfleet.db
      OPENWRT_FLEET_BACKUPS: /data/backups
      OPENWRT_FLEET_DATA: /data
      # SAN des selbstsignierten Zerts (wird bei fehlendem /certs auto-erzeugt).
      TLS_SAN: ${TLS_SAN:-IP:192.168.82.24,DNS:dev,DNS:openwrtfleet}
    volumes:
      - ./data:/data
      # Optional: eigenes Zert einhaengen (cert.pem/key.pem) – dann KEINE
      # Auto-Erzeugung. Ohne diesen Mount legt entrypoint.py selbstsigniert
      # nach ./data/tls (persistent).
      # - ./certs:/certs:ro
